<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Provisionamento - Ultra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Tela cheia estática sem barra de rolagem */
        html, body {
            width: 100%;
            min-width: 100vw;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden !important;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 35%, #091326 0%, #03060d 75%, #020409 100%);
        }

        /* Canvas tecnológico animado no fundo */
        #tech-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Vinheta sutil nas bordas para destacar o card central */
        .bg-vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at center, transparent 45%, rgba(2, 4, 10, 0.72) 100%);
        }

        /* Card em vidro fosco escuro acima da animação */
        .card-container {
            width: 100%;
            max-width: 440px;
            max-height: 94vh;
            padding: 20px 24px !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
            background: rgba(8, 13, 26, 0.76) !important;
            backdrop-filter: blur(18px) !important;
            -webkit-backdrop-filter: blur(18px) !important;
            border: 1px solid rgba(56, 189, 248, 0.32) !important;
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.14), inset 0 0 18px rgba(139, 92, 246, 0.06) !important;
        }

        .card-header { margin-bottom: 12px !important; }
        .tabs-nav { margin-bottom: 14px !important; }
        .form-group { margin-bottom: 11px !important; }
        .form-group label { margin-bottom: 4px !important; font-size: 11px !important; }

        /* Alinhamento dos ícones internos nos inputs e selects */
        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-with-icon input,
        .input-with-icon select {
            width: 100%;
            padding-left: 36px !important;
            padding-top: 9px !important;
            padding-bottom: 9px !important;
            height: auto !important;
            line-height: 1.3 !important;
            box-sizing: border-box;
        }

        .field-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            opacity: 0.65;
            color: #94a3b8;
            z-index: 2;
        }

        /* Alinhamento dos botões REDE NEUTRA e Gerar Acesso */
        .radio-card {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
            padding: 10px 10px !important;
            white-space: nowrap !important;
            line-height: 1 !important;
        }

        .radio-card svg,
        .btn-primary svg {
            display: block;
            flex-shrink: 0;
        }

        .btn-primary {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
            width: 100%;
            padding: 11px 16px !important;
            line-height: 1 !important;
            margin-top: 2px;
        }

        /* Compacta o bloco de resultado para não gerar scroll */
        .resultado-box {
            margin-top: 12px !important;
            padding: 10px 12px !important;
            gap: 8px !important;
        }

        .res-item {
            padding: 6px 10px !important;
        }

        .card-footer {
            margin-top: 12px !important;
            padding-top: 0 !important;
        }

        /* Ajuste específico para a aba SIP */
        #panel-gpon .form-group { margin-bottom: 8px !important; }
        #panel-gpon input { padding: 7px 10px !important; height: auto !important; }
        #panel-gpon textarea { max-height: 85px; }
    </style>
</head>
