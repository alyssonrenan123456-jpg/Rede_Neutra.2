<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Provisionamento - Ultra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        #holo-easter-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .holo-egg {
            position: absolute;
            left: -160px;
            top: 25%;
            opacity: 0;
            will-change: transform, opacity;
        }

        .holo-meteoro-box,
        .holo-solar-box,
        .holo-char-box {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.04);
            border: 1px solid rgba(56, 189, 248, 0.22);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.14), inset 0 0 12px rgba(168, 85, 247, 0.08);
            color: rgba(125, 211, 252, 0.78);
            overflow: hidden;
        }

        .holo-char-box {
            padding: 6px 8px;
        }

        .holo-meteoro-box::after,
        .holo-solar-box::after,
        .holo-char-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(56, 189, 248, 0.08) 3px,
                rgba(56, 189, 248, 0.08) 4px
            );
            pointer-events: none;
        }

        .holo-label {
            font-size: 9px;
            font-family: monospace;
            letter-spacing: 0.12em;
            color: rgba(186, 230, 253, 0.7);
        }

        .holo-svg {
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.55));
        }

        .holo-char-svg {
            height: auto;
        }

        .holo-egg.is-passing {
            animation: holoFly 12s linear forwards;
        }

        @keyframes holoFly {
            0% {
                transform: translate3d(0, 0, 0) scale(0.96);
                opacity: 0;
            }
            10% {
                opacity: 0.72;
            }
            50% {
                transform: translate3d(calc(50vw + 80px), 14px, 0) scale(1);
                opacity: 0.78;
            }
            90% {
                opacity: 0.72;
            }
            100% {
                transform: translate3d(calc(100vw + 220px), -12px, 0) scale(0.96);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <script>
        (function () {
            const canvas = document.getElementById('tech-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, nodes = [], pulses = [];
            const mouse = { x: null, y: null, radius: 170 };

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                initNodes();
            }

            function initNodes() {
                const count = Math.min(75, Math.floor((width * height) / 18000));
                nodes = [];
                for (let i = 0; i < count; i++) {
                    const isPurple = Math.random() < 0.3;
                    nodes.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.14,
                        vy: (Math.random() - 0.5) * 0.14,
                        r: Math.random() * 1.8 + 1.1,
                        color: isPurple ? '168, 85, 247' : '56, 189, 248'
                    });
                }
            }

            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener('mouseleave', () => {
                mouse.x = null;
                mouse.y = null;
            });

            function draw() {
                ctx.clearRect(0, 0, width, height);
                const maxDist = 145;

                for (let i = 0; i < nodes.length; i++) {
                    const a = nodes[i];
                    a.x += a.vx;
                    a.y += a.vy;

                    if (a.x < 0 || a.x > width) a.vx *= -1;
                    if (a.y < 0 || a.y > height) a.vy *= -1;

                    for (let j = i + 1; j < nodes.length; j++) {
                        const b = nodes[j];
                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const dist = Math.hypot(dx, dy);

                        if (dist < maxDist) {
                            const alpha = (1 - dist / maxDist) * 0.28;
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(${a.color}, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();

                            if (pulses.length < 12 && Math.random() < 0.00018) {
                                pulses.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, t: 0, speed: 0.004 + Math.random() * 0.004 });
                            }
                        }
                    }

                    if (mouse.x !== null) {
                        const mdx = a.x - mouse.x;
                        const mdy = a.y - mouse.y;
                        const mdist = Math.hypot(mdx, mdy);
                        if (mdist < mouse.radius) {
                            const alpha = (1 - mdist / mouse.radius) * 0.45;
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
                            ctx.lineWidth = 1;
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }

                    ctx.beginPath();
                    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${a.color}, 0.85)`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = `rgba(${a.color}, 0.9)`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                for (let k = pulses.length - 1; k >= 0; k--) {
                    const p = pulses[k];
                    p.t += p.speed;
                    if (p.t >= 1) {
                        pulses.splice(k, 1);
                        continue;
                    }
                    const px = p.ax + (p.bx - p.ax) * p.t;
                    const py = p.ay + (p.by - p.ay) * p.t;
                    ctx.beginPath();
                    ctx.arc(px, py, 2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(224, 242, 254, 0.95)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#38bdf8';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                requestAnimationFrame(draw);
            }

            resize();
            draw();
        })();
    </script>

    <script>
        (function () {
            const eggs = [
                document.getElementById('egg-meteoro'),
                document.getElementById('egg-sistema-solar'),
                document.getElementById('egg-personagem')
            ].filter(Boolean);

            let currentIndex = 2;

            function runNextEgg() {
                if (!eggs.length) return;

                let tries = 0;
                let el = eggs[currentIndex % eggs.length];
                while (el.id === 'egg-personagem' && !el.dataset.ready && tries < eggs.length) {
                    currentIndex++;
                    el = eggs[currentIndex % eggs.length];
                    tries++;
                }

                const maxTop = el.id === 'egg-personagem' ? 38 : 62;
                const topPercent = Math.floor(10 + Math.random() * maxTop);
                el.style.top = topPercent + '%';
                el.classList.remove('is-passing');
                void el.offsetWidth;
                el.classList.add('is-passing');

                currentIndex++;
            }

            setTimeout(() => {
                runNextEgg();
                setInterval(runNextEgg, 35000);
            }, 4000);
        })();
    </script>
</body>
</html>
