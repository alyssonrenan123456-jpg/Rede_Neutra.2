<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Provisionamento - Ultra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card-container">
        <div class="card-header">
            <h1 id="app-title">Gerador de Login</h1>
            <div class="header-actions">
                <button type="button" class="theme-toggle" onclick="toggleTema()" aria-label="Alternar Tema">
                    <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="5" fill="currentColor"></circle>
                        <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2"></line>
                        <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2"></line>
                        <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2"></line>
                        <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2"></line>
                    </svg>
                </button>
            </div>
        </div>

        <div class="tabs-nav">
            <button type="button" id="tab-login" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button type="button" id="tab-mac" class="tab-btn" onclick="switchTab('mac')">MAC</button>
            <button type="button" id="tab-gpon" class="tab-btn" onclick="switchTab('gpon')">SIP</button>
        </div>

        <div id="panel-login" class="tab-panel">
            <form id="form-login">
                <div class="form-group">
                    <label>NOME DO CLIENTE</label>
                    <input type="text" name="nome" placeholder="Ex: João Silva" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>TIPO DE LOGIN</label>
                    <div class="radio-toggle-group">
                        <label class="radio-card active" id="card-neutra">
                            <input type="radio" name="tipo_login" value="neutra" checked onclick="selecionarTipo('neutra')">
                            <span>REDE NEUTRA</span>
                        </label>
                        <label class="radio-card" id="card-padrao">
                            <input type="radio" name="tipo_login" value="padrao" onclick="selecionarTipo('padrao')">
                            <span>PADRÃO / LOCAL</span>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="grupo-rede">
                    <label>REDE</label>
                    <select name="rede" id="rede" onchange="atualizarCidades()" required>
                        <option value="">Selecione a rede</option>
                        {% for r in redes %}
                            <option value="{{ r }}">{{ r }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" id="grupo-id-atplus" style="display: none;">
                    <label>ID ATPLUS</label>
                    <input type="text" name="id_atplus" id="input-id-atplus" placeholder="Ex: 25282" autocomplete="off">
                </div>

                <div class="form-group">
                    <label>CIDADE</label>
                    <select name="cidade" id="cidade" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    <span id="btn-text">Gerar Acesso</span>
                    <span id="btn-loader" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div id="resultado-bloco" class="resultado-box" style="display: none;">
                <div class="res-item">
                    <div class="res-content">
                        <small>LOGIN GENERATED</small>
                        <strong id="login">-</strong>
                    </div>
                    <button type="button" class="btn-copy-icon" onclick="copyValue('login')">Copiar</button>
                </div>
                <div class="res-item">
                    <div class="res-content">
                        <small>PASSWORD GENERATED</small>
                        <strong id="senha">-</strong>
                    </div>
                    <button type="button" class="btn-copy-icon" onclick="copyValue('senha')">Copiar</button>
                </div>
            </div>
        </div>

        <div id="panel-mac" class="tab-panel" style="display: none;">
            <form id="form-mac">
                <div class="form-group">
                    <label>ENDEREÇO MAC</label>
                    <input type="text" name="mac" id="input-mac-raw" placeholder="Ex: AA:BB:CC:DD:EE:FF ou AABBCCDDEEFF" required autocomplete="off">
                </div>

                <button type="submit" id="submit-mac-btn" class="btn-primary">
                    <span id="btn-mac-text">Formatar MAC</span>
                    <span id="btn-mac-loader" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div id="resultado-mac-bloco" class="resultado-box" style="display: none;">
                <div class="res-item">
                    <div class="res-content"><small>CISCO</small><strong id="mac-cisco">-</strong></div>
                    <button type="button" class="btn-copy-icon" onclick="copyValue('mac-cisco')">Copiar</button>
                </div>
                <div class="res-item">
                    <div class="res-content"><small>LINUX</small><strong id="mac-linux">-</strong></div>
                    <button type="button" class="btn-copy-icon" onclick="copyValue('mac-linux')">Copiar</button>
                </div>
                <div class="res-item">
                    <div class="res-content"><small>WINDOWS</small><strong id="mac-windows">-</strong></div>
                    <button type="button" class="btn-copy-icon" onclick="copyValue('mac-windows')">Copiar</button>
                </div>
                <div class="res-item">
                    <div class="res-content"><small>HUAWEI</small><strong id="mac-huawei">-</strong></div>
                    <button type="button" class="btn-copy-icon" onclick="copyValue('mac-huawei')">Copiar</button>
                </div>
                <div class="res-item">
                    <div class="res-content"><small>FABRICANTE (OUI)</small><strong id="mac-vendor">-</strong></div>
                </div>
            </div>
        </div>

        <div id="panel-gpon" class="tab-panel" style="display: none;">
            <form id="form-gpon" onsubmit="gerarGponConfig(event)">
                <div class="grid-2col">
                    <div class="form-group"><label>PON</label><input type="text" id="gpon-pon" placeholder="1/1/1" required></div>
                    <div class="form-group"><label>ONU ID</label><input type="text" id="gpon-onu" placeholder="1" required></div>
                </div>
                <div class="grid-2col">
                    <div class="form-group"><label>CAIXA</label><input type="text" id="gpon-caixa" placeholder="CTO-01" required></div>
                    <div class="form-group"><label>PORTA</label><input type="text" id="gpon-porta" placeholder="01" required></div>
                </div>
                <div class="form-group"><label>LOGIN</label><input type="text" id="gpon-login" placeholder="cliente.mca" required></div>
                <div class="form-group"><label>SERIAL / MAC</label><input type="text" id="gpon-serial" placeholder="4857544312345678" required></div>
                <div class="grid-2col">
                    <div class="form-group"><label>VLAN</label><input type="text" id="gpon-vlan" placeholder="100" required></div>
                    <div class="form-group"><label>USUÁRIO SIP</label><input type="text" id="gpon-sip" placeholder="558830000000" required></div>
                </div>
                <div class="grid-2col">
                    <div class="form-group"><label>SP VOIP</label><input type="text" id="gpon-sp-voip" placeholder="10" required></div>
                    <div class="form-group"><label>SP DADOS</label><input type="text" id="gpon-sp-dados" placeholder="11" required></div>
                </div>

                <button type="submit" class="btn-primary">Gerar Script SIP</button>
            </form>

            <div id="resultado-gpon-bloco" class="resultado-box" style="display: none;">
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="margin-bottom: 0;">SCRIPT GERADO</label>
                        <button type="button" class="btn-copy-icon" onclick="copyValue('gpon-script-out')">Copiar Script</button>
                    </div>
                    <textarea id="gpon-script-out" rows="8" readonly></textarea>
                </div>
            </div>
        </div>

        <div class="card-footer">
            <small>Desenvolvido por Alysson Cordeiro 🛠️</small>
        </div>
    </div>

    <div id="toast" class="toast">Copiado para a área de transferência!</div>

    <script>
        const redesCidades = {{ redes_cidades | tojson }};
        const cidadesSiglas = {{ cidades | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
